<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HUNTER999x - MMORPG 2D</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Tahoma,sans-serif}
body{background:#000;color:#fff;overflow:hidden;height:100vh;display:flex;flex-direction:column}
.top{height:44px;background:linear-gradient(#2a1a05,#0a0a0a);border-bottom:2px solid #e8c33a;display:flex;align-items:center;gap:10px;padding:0 10px;font-size:13px}
.logo{font-weight:900;font-size:20px;color:#e8c33a}.logo b{color:#fff}
#wrap{flex:1;position:relative;overflow:hidden;background:#1a2a0a}
canvas{width:100%;height:100%;display:block}
.bottom{background:#111;border-top:2px solid #e8c33a;padding:6px}
.bars{display:flex;gap:6px}.barBox{flex:1}.barBox b{font-size:10px}
.bar{height:14px;background:#000;border:1px solid #555;position:relative;overflow:hidden;border-radius:7px}.bar i{position:absolute;left:0;top:0;bottom:0;transition:width .3s}.bar span{position:absolute;inset:0;text-align:center;font-size:10px;line-height:14px}
.btns{display:flex;gap:5px;margin-top:6px}.btns button{flex:1;background:linear-gradient(#333,#111);border:1px solid #555;color:#fff;padding:11px 4px;font-weight:900;border-radius:8px;font-size:12px}
.btns button.on{background:linear-gradient(#00a000,#006000)}
#chat{height:48px;background:#000;border:1px solid #333;overflow-y:auto;padding:4px;font-size:11px;margin-top:5px}
.chatIn{display:flex;gap:4px;margin-top:4px}.chatIn input{flex:1;background:#000;color:#fff;border:1px solid #555;padding:8px}.chatIn button{background:#e8c33a;color:#000;border:none;padding:8px 14px;font-weight:900}
.joy{display:flex;gap:5px;justify-content:center;margin-top:5px}.joy button{background:#222;border:1px solid #555;color:#fff;width:52px;height:42px;font-size:18px;border-radius:10px}
#start{position:fixed;inset:0;background:radial-gradient(#2a1a05,#000);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
#start h1{font-size:50px;color:#e8c33a;text-shadow:0 0 30px #f00}
.vocs{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;width:100%;max-width:400px;margin:15px 0}.vocs button{background:#1a1a1a;border:2px solid #555;padding:16px;color:#fff;border-radius:10px}
#play{background:#28a745;color:#fff;border:none;padding:14px 50px;font-size:20px;font-weight:900;border-radius:10px}
input[type=text],input[type=password]{width:100%;max-width:400px;padding:12px;background:#111;color:#fff;border:1px solid #555;border-radius:8px;text-align:center;margin:5px 0}
</style>
</head>
<body>
<div class="top"><div class="logo">HUNTER<b>999x</b></div><span>🪙 <b id="gold" style="color:#ffd700">0</b></span><span>Lv <b id="lv">1</b></span><span id="nickTop">Teste</span><span style="margin-left:auto">🟢 16.343</span></div>
<div id="wrap"><canvas id="cv"></canvas></div>
<div class="bottom">
<div class="bars"><div class="barBox"><b>❤️ HP</b><div class="bar"><i id="hpF" style="background:linear-gradient(#0f0,#060);width:100%"></i><span id="hpT">100/100</span></div></div><div class="barBox"><b>💙 MANA</b><div class="bar"><i id="mpF" style="background:linear-gradient(#0af,#005);width:100%"></i><span id="mpT">100/100</span></div></div><div class="barBox"><b>⭐ EXP</b><div class="bar"><i id="xpF" style="background:linear-gradient(#ff0,#f80);width:0%"></i><span id="xpT">0%</span></div></div></div>
<div class="btns"><button id="autoB" class="on" onclick="toggleAuto()">🤖 AUTO: ON</button><button onclick="collect()">📦 COLETAR</button><button onclick="heal()">🧪 POTION</button><button onclick="attack()">⚔️ ATACAR</button></div>
<div id="chat"><div><b style="color:#ff0">HUNTER999x:</b> MMORPG 2D Animado ligado! Seu char caça sozinho!</div></div>
<div class="chatIn"><input id="chatIn" placeholder="hi, trade, heal..."><button onclick="sendChat()">Falar</button></div>
<div class="joy"><button onclick="move(-1,0)">◀️</button><button onclick="move(0,-1)">🔼</button><button onclick="move(0,1)">🔽</button><button onclick="move(1,0)">▶️</button><button onclick="attack()">⚔️</button></div>
</div>
<div id="start"><h1>HUNTER999x</h1><p style="color:#aaa">MMORPG 2D ANIMADO • Thais</p><div class="vocs"><button onclick="pick('🧔',this)"><div style="font-size:30px">🧔</div><b>Knight</b></button><button onclick="pick('🧙',this)"><div style="font-size:30px">🧙</div><b>Sorcerer</b></button><button onclick="pick('🧝',this)"><div style="font-size:30px">🧝</div><b>Druid</b></button><button onclick="pick('🏹',this)"><div style="font-size:30px">🏹</div><b>Paladin</b></button></div><input type="text" id="nick" placeholder="Seu nome - ex: A lenda"><button id="play" onclick="start()">▶️ ENTRAR NO MUNDO</button><p style="font-size:11px;color:#666;margin-top:8px">Animação lisa • Partículas • Sem grade Atari</p></div>
<script>
let cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let W,H; function resize(){W=cv.width=cv.clientWidth*devicePixelRatio;H=cv.height=cv.clientHeight*devicePixelRatio} window.addEventListener('resize',resize); resize();
let P={x:400,y:300,tx:400,ty:300,name:'Teste',emoji:'🧔',hp:100,mhp:100,mp:100,mmp:100,gold:0,lv:1,exp:0,auto:true,loot:0,walk:0,dir:1,atk:0};
let Mons=[]; function spawn(m){Mons.push(m)}
spawn({x:200,y:180,name:'Pizetta',emoji:'🧝',hp:100,isNpc:true,walk:0});
spawn({x:320,y:180,name:'Murwyn',emoji:'🧙',hp:100,isNpc:true,walk:0});
spawn({x:600,y:150,name:'Rat',emoji:'🐀',hp:60,walk:0});
spawn({x:150,y:400,name:'Snake',emoji:'🐍',hp:80,walk:0});
spawn({x:550,y:400,name:'Rotworm',emoji:'🐛',hp:90,walk:0});
spawn({x:300,y:500,name:'Troll',emoji:'👹',hp:120,walk:0});
spawn({x:700,y:300,name:'Dragon',emoji:'🐉',hp:500,walk:0});
spawn({x:100,y:250,name:'Demon',emoji:'😈',hp:800,walk:0});
let parts=[],floats=[],trees=[{x:120,y:120},{x:680,y:480},{x:600,y:120},{x:150,y:500}],houses=[{x:480,y:100,w:180,h:120}];
let cam={x:0,y:0};
function drawMap(){
let ox=-cam.x,oy=-cam.y;
// chão com textura lisa
for(let gy=0;gy<12;gy++)for(let gx=0;gx<20;gx++){
let x=gx*60+ox,y=gy*60+oy;
let isGrass=(gx+gy)%4==0;
ctx.fillStyle=isGrass?'#2e5a1a':'#6b4a22'; ctx.fillRect(x,y,60,60);
ctx.fillStyle='rgba(0,0,0,0.08)'; if((gx*gy)%3==0) ctx.fillRect(x+10,y+10,8,8);
if(isGrass){ctx.fillStyle='#3a7a1a'; ctx.beginPath(); ctx.arc(x+20,y+20,3,0,7); ctx.fill();}
// pedra central
if(gy>=5&&gy<=6){ctx.fillStyle='#555'; ctx.fillRect(x,y,60,60); ctx.fillStyle='#777'; ctx.fillRect(x+5,y+5,50,50); ctx.fillStyle='#333'; ctx.fillRect(x+10,y+10,10,5);}
}
// casa com sombra e telhado
houses.forEach(h=>{
let x=h.x+ox,y=h.y+oy;
ctx.fillStyle='rgba(0,0,0,0.4)'; ctx.fillRect(x+8,y+8,h.w,h.h);
ctx.fillStyle='#8a6a2a'; ctx.fillRect(x,y+30,h.w,h.h-30);
ctx.fillStyle='#4a1a0a'; ctx.beginPath(); ctx.moveTo(x-10,y+30); ctx.lineTo(x+h.w/2,y-10); ctx.lineTo(x+h.w+10,y+30); ctx.fill();
ctx.fillStyle='#ffd700'; ctx.fillRect(x+70,y+70,40,50);
ctx.fillStyle='#fff'; ctx.fillRect(x+20,y+50,30,20); ctx.fillRect(x+120,y+50,30,20);
});
// árvores com sombra
trees.forEach(t=>{
let x=t.x+ox,y=t.y+oy;
ctx.fillStyle='rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(x,y+20,28,8,0,0,7); ctx.fill();
ctx.fillStyle='#5a3a1a'; ctx.fillRect(x-4,y,8,22);
ctx.fillStyle='#0a5a0a'; ctx.beginPath(); ctx.arc(x,y-10,26,0,7); ctx.fill();
ctx.fillStyle='#1a8a1a'; ctx.beginPath(); ctx.arc(x-8,y-18,14,0,7); ctx.fill();
});
}
function drawEnt(e,isMe){
let x=e.x-cam.x,y=e.y-cam.y;
let bob=Math.sin(e.walk)*3;
let scale=isMe?1.25:1;
ctx.fillStyle='rgba(0,0,0,0.4)'; ctx.beginPath(); ctx.ellipse(x,y+18,18*scale,6,0,0,7); ctx.fill();
if(e.atk>0){ctx.fillStyle='rgba(255,255,0,0.5)'; ctx.beginPath(); ctx.arc(x,y,28,0,7); ctx.fill();}
ctx.font=(26*scale)+'px Arial'; ctx.textAlign='center'; ctx.fillText(e.emoji,x,y+bob);
ctx.fillStyle='rgba(0,0,0,0.7)'; ctx.fillRect(x-18,y-28,36,10);
ctx.fillStyle='#fff'; ctx.font='bold 7px Tahoma'; ctx.fillText(e.name,x,y-20);
ctx.fillStyle='#000'; ctx.fillRect(x-16,y-14,32,4);
ctx.fillStyle=e.hp>50?'#0f0':e.hp>25?'#ff0':'#f00'; ctx.fillRect(x-16,y-14,32*Math.max(0,e.hp/100),4);
}
function drawParts(){
parts.forEach(p=>{ctx.globalAlpha=p.life; ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x-cam.x,p.y-cam.y,p.size,0,7); ctx.fill(); ctx.globalAlpha=1});
floats.forEach(f=>{ctx.globalAlpha=f.life; ctx.fillStyle=f.color; ctx.font='900 16px Tahoma'; ctx.textAlign='center'; ctx.fillText(f.txt,f.x-cam.x,f.y-cam.y); ctx.globalAlpha=1});
}
function burst(x,y,color,n){for(let i=0;i<n;i++)parts.push({x:x,y:y,vx:(Math.random()-0.5)*6,vy:(Math.random()-0.5)*6-2,life:1,size:Math.random()*4+2,color:color})}
function loop(){
ctx.clearRect(0,0,W,H);
// câmera segue player liso
cam.x+=(P.x-W/2/2-cam.x)*0.08; cam.y+=(P.y-H/2/2-cam.y)*0.08;
drawMap();
Mons.forEach(m=>drawEnt(m,false)); drawEnt(P,true); drawParts();
// atualizar
P.x+=(P.tx-P.x)*0.15; P.y+=(P.ty-P.y)*0.15; P.walk+=0.2; if(P.atk>0)P.atk--;
Mons.forEach(m=>{m.walk+=0.15; if(!m.isNpc&&Math.random()<0.01){m.x+= (Math.random()-0.5)*20; m.y+=(Math.random()-0.5)*20}});
parts.forEach(p=>{p.x+=p.vx; p.y+=p.vy; p.vy+=0.2; p.life-=0.03}); parts=parts.filter(p=>p.life>0);
floats.forEach(f=>{f.y-=1; f.life-=0.02}); floats=floats.filter(f=>f.life>0);
requestAnimationFrame(loop);
}
function move(dx,dy){P.tx+=dx*45; P.ty+=dy*45; P.tx=Math.max(30,Math.min(1100,P.tx)); P.ty=Math.max(30,Math.min(650,P.ty));}
function attack(){
let t=Mons.find(m=>!m.isNpc&&Math.abs(m.x-P.x)<80&&Math.abs(m.y-P.y)<80);
if(!t)return; P.atk=10;
let dmg=Math.floor(Math.random()*80)+30; t.hp-=dmg; burst(t.x,t.y,'#ff0',12); burst(t.x,t.y,'#f00',8); floats.push({x:t.x,y:t.y-20,txt:'-'+dmg,life:1,color:'#ff4444'});
if(t.hp<=0){Mons=Mons.filter(m=>m!==t); let g=Math.floor(Math.random()*100)+40; P.loot+=g; P.exp+=15; if(P.exp>=100){P.exp=0; P.lv++; P.mhp+=20; P.hp=P.mhp; burst(P.x,P.y,'#ffd700',30); floats.push({x:P.x,y:P.y-30,txt:'LEVEL UP!',life:1,color:'#ffd700'}); addChat('Sistema','LEVEL UP Lv '+P.lv)} addChat('Loot','Matou '+t.name+'! +'+g+' gold'); setTimeout(()=>{Mons.push({x:Math.random()*700+50,y:Math.random()*400+50,name:'Rat',emoji:'🐀',hp:60,walk:0})},1500)}
update();
}
function collect(){if(!P.loot){showMsg('Sem loot!');return}P.gold+=P.loot; burst(P.x,P.y,'#ffd700',15); P.loot=0; update()}
function heal(){P.hp=P.mhp; P.mp=P.mmp; burst(P.x,P.y,'#0f0',15); update()}
function toggleAuto(){P.auto=!P.auto; document.getElementById('autoB').textContent=P.auto?'🤖 AUTO: ON':'🤖 AUTO: OFF'; document.getElementById('autoB').className=P.auto?'on':''}
function update(){document.getElementById('gold').textContent=(P.gold+P.loot).toLocaleString('pt-BR'); document.getElementById('lv').textContent=P.lv; document.getElementById('hpT').textContent=P.hp+'/'+P.mhp; document.getElementById('hpF').style.width=(P.hp/P.mhp*100)+'%'; document.getElementById('mpT').textContent=P.mp+'/'+P.mmp; document.getElementById('xpT').textContent=Math.floor(P.exp)+'%'; document.getElementById('xpF').style.width=P.exp+'%'}
function addChat(w,t){let c=document.getElementById('chat'); c.innerHTML+='<div><b>'+w+':</b> '+t+'</div>'; c.scrollTop=c.scrollHeight}
function showMsg(t){addChat('Sistema',t)}
function sendChat(){let i=document.getElementById('chatIn'); let t=i.value.trim(); if(!t)return; addChat(P.name,t); i.value=''; if(t.toLowerCase()=='hi')addChat('Pizetta','Olá '+P.name+'!'); if(t.toLowerCase()=='heal'){heal(); addChat('Pizetta','Curado!')}}
function pick(e,btn){P.emoji=e; document.querySelectorAll('.vocs button').forEach(b=>b.style.borderColor='#555'); btn.style.borderColor='#ffd700'}
function start(){let n=document.getElementById('nick').value.trim(); if(n)P.name=n; document.getElementById('nickTop').textContent=P.name; document.getElementById('start').style.display='none'; update(); loop();}
document.addEventListener('keydown',e=>{if(e.key=='w'||e.key=='ArrowUp')move(0,-1); if(e.key=='s'||e.key=='ArrowDown')move(0,1); if(e.key=='a'||e.key=='ArrowLeft')move(-1,0); if(e.key=='d'||e.key=='ArrowRight')move(1,0); if(e.key==' ')attack()});
setInterval(()=>{if(!P.auto||document.getElementById('start').style.display!='none')return; let near=Mons.find(m=>!m.isNpc&&Math.abs(m.x-P.x)<80&&Math.abs(m.y-P.y)<80); if(near)attack(); else{let t=Mons.find(m=>!m.isNpc); if(!t)return; let dx=Math.sign(t.x-P.x),dy=Math.sign(t.y-P.y); if(Math.random()<0.5&&dx!=0)move(dx,0); else move(0,dy)} if(Math.random()<0.1)collect()},900);
</script>
</body>
</html>
