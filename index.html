<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HUNTER999x - Cliente</title>
<link rel="manifest" href="data:application/json,{}">
<meta name="theme-color" content="#0a0a0a">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Tahoma,Verdana,sans-serif}
body{background:#0a0a0a;color:#fff;height:100vh;overflow:hidden}
.screen{display:none;height:100vh;flex-direction:column}.screen.active{display:flex}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;background:radial-gradient(#2a1a0a,#000)}
.logo{font-size:48px;font-weight:900;color:#e8c33a;text-shadow:0 0 20px #f00}.logo b{color:#fff}
.sub{color:#aaa;font-size:13px;margin:4px 0 16px}
.card{width:100%;max-width:380px;background:#1a1a1a;border:1px solid #444;border-radius:10px;padding:16px}
.card input,.card select{width:100%;padding:12px;margin:6px 0;background:#000;color:#fff;border:1px solid #555;border-radius:6px;font-size:14px;text-align:center}
.btn{width:100%;padding:13px;margin:6px 0;border:none;border-radius:8px;font-size:16px;font-weight:900;cursor:pointer}
.btn-green{background:#28a745;color:#fff}.btn-blue{background:#2a4a8a;color:#fff}.btn-gold{background:#e8c33a;color:#000}
.link{color:#e8c33a;font-size:12px;margin-top:8px;cursor:pointer;text-decoration:underline}
.top{height:42px;background:#1a140a;border-bottom:2px solid #5a3a00;display:flex;align-items:center;gap:8px;padding:0 8px;font-size:12px;white-space:nowrap;overflow-x:auto}
#game{flex:1;position:relative;background:#3a2a1a;overflow:hidden}
#map{position:absolute;inset:0;display:grid;grid-template-columns:repeat(15,1fr);grid-template-rows:repeat(11,1fr)}
.tile{border:.5px solid rgba(0,0,0,.3)}.terra{background:#6b4a22}.pedra{background:#5a5a5a}.grama{background:#2a5a1a}.madeira{background:#8a6a2a}.telhado{background:#4a1a0a}.parede{background:#6a5a3a}.agua{background:#0a3a8a}.areia{background:#c9b06a}
.ent{position:absolute;transform:translate(-50%,-70%);text-align:center;transition:all .3s;pointer-events:none}.ent .nm{font-size:7px;background:rgba(0,0,0,.7);padding:1px 3px;border-radius:2px;white-space:nowrap}.ent .hp{width:22px;height:3px;background:#000;margin:1px auto}.ent .hp i{display:block;height:100%;background:#0f0}.ent .sp{font-size:16px}.ent.me .sp{font-size:19px}.ent.me .nm{color:#ff0}
.bottom{background:#1a140a;border-top:2px solid #5a3a00;padding:5px}
.vitals{display:flex;gap:6px}.vital{flex:1}.bar{height:13px;background:#000;border:1px solid #555;position:relative}.bar i{position:absolute;left:0;top:0;bottom:0}.bar span{position:absolute;inset:0;text-align:center;font-size:9px;line-height:13px}
.idleBar{display:flex;gap:4px;margin:4px 0}.idleBar button{flex:1;background:#2a2a2a;border:1px solid #555;color:#fff;padding:9px 4px;font-size:11px;font-weight:bold;border-radius:6px}
.chat{height:48px;background:#000;border:1px solid #333;overflow-y:auto;padding:4px;font-size:11px}
.chatIn{display:flex;gap:4px;margin-top:4px}.chatIn input{flex:1;background:#000;color:#fff;border:1px solid #555;padding:7px}.chatIn button{background:#2a4a8a;color:#fff;border:none;padding:7px 12px;font-weight:bold}
.ctrls{display:flex;gap:4px;justify-content:center;margin-top:4px}.ctrls button{background:#222;color:#fff;border:1px outset #555;width:48px;height:38px;font-size:16px;border-radius:4px}
#msg{position:absolute;top:46px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.92);color:#ff0;padding:8px 12px;border:1px solid #ff0;border-radius:6px;font-size:12px;z-index:99;display:none;max-width:90%;text-align:center}
.vocs{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;width:100%;max-width:380px;margin:12px 0}.vocs button{background:#1a1a1a;border:2px solid #555;padding:12px;color:#fff;border-radius:8px;cursor:pointer}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="scr-login" class="screen active"><div class="center"><div class="logo">HUNTER<b>999x</b></div><div class="sub">CLIENTE OFICIAL • TIBIA IDLE • v1.0</div><div class="card"><h3>🔐 LOGIN</h3><input id="loginEmail" placeholder="Email"><input id="loginPass" type="password" placeholder="Senha"><button class="btn btn-green" onclick="doLogin()">▶️ ENTRAR NO JOGO</button><button class="btn btn-blue" onclick="showScreen('register')">✨ CRIAR CONTA GRÁTIS</button><div class="link" onclick="showScreen('register')">Ainda não tem conta? Criar agora</div><p style="font-size:10px;color:#666;margin-top:10px">Cliente HUNTER999x • Salva no seu aparelho • Jogue offline</p></div></div></div>

<!-- CRIAR CONTA -->
<div id="scr-register" class="screen"><div class="center"><div class="logo">HUNTER<b>999x</b></div><div class="sub">Criar sua conta</div><div class="card"><input id="regName" placeholder="Nome do personagem - ex: A lenda"><input id="regEmail" placeholder="Seu email"><input id="regPass" type="password" placeholder="Crie uma senha"><select id="regVoc"><option value="🧔">Knight - HP Alto</option><option value="🧙">Sorcerer - Dano Alto</option><option value="🧝">Druid - Heal</option><option value="🏹">Paladin - Distância</option></select><button class="btn btn-green" onclick="doRegister()">✅ CRIAR CONTA E JOGAR</button><button class="btn btn-blue" onclick="showScreen('login')">⬅️ Já tenho conta</button></div></div></div>

<!-- JOGO -->
<div id="scr-game" class="screen">
<div class="top"><div style="font-weight:900;color:#e8c33a">HUNTER<b style="color:#fff">999x</b></div><span>🪙 <b id="goldTop" style="color:#ffd700">0</b></span><span>Lv <b id="lvTop">1</b></span><span>🟢 <b id="charNameTop">A lenda</b></span><span style="margin-left:auto" onclick="logout()">🚪 Sair</span></div>
<div id="game"><div id="msg"></div><div id="map"></div></div>
<div class="bottom"><div class="vitals"><div class="vital">❤️<div class="bar"><i id="hpFill" style="background:#00c000;width:100%"></i><span id="hpTxt">100 / 100</span></div></div><div class="vital">💙<div class="bar"><i id="mpFill" style="background:#0066ff;width:100%"></i><span id="mpTxt">100 / 100</span></div></div><div class="vital">⭐<div class="bar"><i id="expFill" style="background:#ffaa00;width:0%"></i><span id="expTxt">0%</span></div></div></div><div class="idleBar"><button id="autoBtn" onclick="toggleAuto()">🤖 AUTO: ON</button><button onclick="collectLoot()" style="background:#8a6a00">📦 COLETAR</button><button onclick="heal()">🧪 POTION</button><button onclick="attack()">⚔️ ATACAR</button></div><div class="chat" id="chat"><div><b>HUNTER999x:</b> Bem-vindo! Auto Hunt ligado!</div></div><div class="chatIn"><input id="chatIn" placeholder="hi, trade, heal..."><button onclick="sendChat()">Falar</button></div><div class="ctrls"><button onclick="move(-1,0)">◀️</button><button onclick="move(0,-1)">🔼</button><button onclick="move(0,1)">🔽</button><button onclick="move(1,0)">▶️</button><button onclick="attack()">⚔️</button><button onclick="heal()">🧪</button></div></div>
</div>

<script>
let P={x:7,y:5,name:'A lenda',emoji:'🧔',hp:100,mhp:100,mp:100,mmp:100,gold:0,lv:1,exp:0,auto:true,loot:0};
let Mons=[{x:3,y:2,name:'Pizetta',emoji:'🧝',hp:100,isNpc:true},{x:5,y:2,name:'Murwyn',emoji:'🧙',hp:100,isNpc:true},{x:2,y:7,name:'Rat',emoji:'🐀',hp:60},{x:12,y:8,name:'Snake',emoji:'🐍',hp:80},{x:10,y:3,name:'Rotworm',emoji:'🐛',hp:90},{x:4,y:9,name:'Troll',emoji:'👹',hp:120},{x:13,y:5,name:'Dragon',emoji:'🐉',hp:500},{x:1,y:4,name:'Demon',emoji:'😈',hp:800},{x:8,y:8,name:'Rat',emoji:'🐀',hp:60}];
let cols=15,rows=11,mapEl=document.getElementById('map');
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById('scr-'+id).classList.add('active')}
function save(){localStorage.setItem('hunter999x',JSON.stringify({name:P.name,emoji:P.emoji,gold:P.gold,lv:P.lv,exp:P.exp}))}
function load(){let d=localStorage.getItem('hunter999x');if(d){let j=JSON.parse(d);P.name=j.name;P.emoji=j.emoji;P.gold=j.gold;P.lv=j.lv;P.exp=j.exp}}
function doRegister(){let n=document.getElementById('regName').value.trim();let e=document.getElementById('regEmail').value.trim();let p=document.getElementById('regPass').value;if(!n||!e||!p){alert('Preencha nome, email e senha!');return}P.name=n;P.emoji=document.getElementById('regVoc').value;P.gold=100;P.lv=1;P.exp=0;localStorage.setItem('hunter999x_user',JSON.stringify({email:e,pass:p,name:n}));save();startGame()}
function doLogin(){let e=document.getElementById('loginEmail').value.trim();let p=document.getElementById('loginPass').value;let u=localStorage.getItem('hunter999x_user');if(!u){alert('Nenhuma conta! Crie uma conta primeiro!');showScreen('register');return}let j=JSON.parse(u);if(j.email==e&&j.pass==p){load();startGame()}else{alert('Email ou senha errada!')}}
function logout(){save();showScreen('login')}
function startGame(){showScreen('game');document.getElementById('charNameTop').textContent=P.name;build();updateBars();showMsg('Bem-vindo, '+P.name+'! Auto Hunt ON!')}
function tileType(x,y){if(y==0&&x>=9&&x<=11)return 'telhado';if(y>=1&&y<=2&&x>=9&&x<=11)return 'madeira';if(x==0||y==0||x==14||y==10)return 'parede';if(y==4||y==5)return 'pedra';if(x==6&&y==1)return 'agua';if((x+y)%5==0)return 'grama';if(x>=12&&y>=9)return 'areia';return 'terra'}
function build(){mapEl.innerHTML='';for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){let d=document.createElement('div');d.className='tile '+tileType(x,y);mapEl.appendChild(d)}render()}
function render(){document.querySelectorAll('.ent').forEach(e=>e.remove());Mons.forEach(m=>{let e=document.createElement('div');e.className='ent';e.style.left=((m.x+0.5)/cols*100)+'%';e.style.top=((m.y+0.5)/rows*100)+'%';e.innerHTML=`<div class="nm">${m.name}</div><div class="hp"><i style="width:${Math.max(0,m.hp/8)}%"></i></div><div class="sp">${m.emoji}</div>`;mapEl.appendChild(e)});let p=document.createElement('div');p.className='ent me';p.style.left=((P.x+0.5)/cols*100)+'%';p.style.top=((P.y+0.5)/rows*100)+'%';p.innerHTML=`<div class="nm">${P.name}</div><div class="hp"><i style="width:${P.hp/P.mhp*100}%"></i></div><div class="sp">${P.emoji}</div>`;mapEl.appendChild(p)}
function move(dx,dy){let nx=P.x+dx,ny=P.y+dy;if(nx<0||nx>=cols||ny<0||ny>=rows)return;P.x=nx;P.y=ny;render();let m=Mons.find(m=>m.x==nx&&m.y==ny);if(m&&!m.isNpc)attack()}
function attack(){let t=Mons.find(m=>!m.isNpc&&Math.abs(m.x-P.x)<=1&&Math.abs(m.y-P.y)<=1);if(!t)return;let dmg=Math.floor(Math.random()*60)+20;t.hp-=dmg;if(t.hp<=0){Mons=Mons.filter(m=>m!==t);let g=Math.floor(Math.random()*100)+20;P.loot+=g;P.exp+=15;if(P.exp>=100){P.exp=0;P.lv++;P.mhp+=20;P.hp=P.mhp;showMsg('🎉 LEVEL UP! Lv '+P.lv);addChat('Sistema','LEVEL UP Lv '+P.lv)}addChat('Loot',`Matou ${t.name}! +${g} gold no chão`);setTimeout(()=>{Mons.push({x:Math.floor(Math.random()*13)+1,y:Math.floor(Math.random()*9)+1,name:'Rat',emoji:'🐀',hp:60});render()},1500)}updateBars();render();save()}
function collectLoot(){if(!P.loot){showMsg('Sem loot! Mate monstros!');return}P.gold+=P.loot;showMsg(`📦 Coletou ${P.loot} gold! Total ${P.gold}`);P.loot=0;updateBars();save()}
function toggleAuto(){P.auto=!P.auto;document.getElementById('autoBtn').textContent=P.auto?'🤖 AUTO: ON':'🤖 AUTO: OFF';showMsg(P.auto?'Auto Hunt ON':'Auto Hunt OFF')}
function heal(){P.hp=P.mhp;P.mp=P.mmp;updateBars();showMsg('🧪 Potion! HP cheio!')}
function updateBars(){document.getElementById('hpTxt').textContent=P.hp+' / '+P.mhp;document.getElementById('hpFill').style.width=(P.hp/P.mhp*100)+'%';document.getElementById('mpTxt').textContent=P.mp+' / '+P.mmp;document.getElementById('expTxt').textContent=Math.floor(P.exp)+'%';document.getElementById('expFill').style.width=P.exp+'%';document.getElementById('goldTop').textContent=(P.gold+P.loot).toLocaleString('pt-BR');document.getElementById('lvTop').textContent=P.lv}
function showMsg(t){let m=document.getElementById('msg');m.textContent=t;m.style.display='block';setTimeout(()=>m.style.display='none',2500)}
function addChat(w,t){let c=document.getElementById('chat');c.innerHTML+=`<div><b>${w}:</b> ${t}</div>`;c.scrollTop=c.scrollHeight}
function sendChat(){let i=document.getElementById('chatIn');let t=i.value.trim();if(!t)return;addChat(P.name,t);i.value='';if(t.toLowerCase()=='hi')addChat('Pizetta','Olá '+P.name+'! Quer trade?');if(t.toLowerCase()=='heal'){heal();addChat('Pizetta','Curado!')}}
setInterval(()=>{if(!P.auto||document.getElementById('scr-game').classList.contains('active')==false)return;let near=Mons.find(m=>!m.isNpc&&Math.abs(m.x-P.x)<=1&&Math.abs(m.y-P.y)<=1);if(near)attack();else{let target=Mons.find(m=>!m.isNpc);if(!target)return;let dx=Math.sign(target.x-P.x),dy=Math.sign(target.y-P.y);if(Math.random()<0.5&&dx!=0)move(dx,0);else if(dy!=0)move(0,dy);else if(dx!=0)move(dx,0)}if(Math.random()<0.1)collectLoot()},900);
</script>
</body>
</html>
